<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="theme-color" content="#111827">

    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f4f6; color: #111827;

    <main>
        <img src="pwa/icon-192.png" alt="">
